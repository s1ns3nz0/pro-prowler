services:
  pro-prowler:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - pro-prowler-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import os,urllib.request; urllib.request.urlopen(f'http://localhost:'+os.environ.get('PORT','8000')+'/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pro-prowler-data:

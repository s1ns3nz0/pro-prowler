- check_id: ec2_sg_ssh_open_to_world
  title: Security Group SSH Open to World
  description: Ensure no security group allows SSH (port 22) from 0.0.0.0/0
  severity: CRITICAL
  resource_types:
  - aws_security_group
  detection_logic:
    field_path: ingress
    operator: not_contains
    expected_value:
      from_port: 22
      to_port: 22
      cidr_blocks:
      - 0.0.0.0/0
  remediation: Restrict SSH access to specific IP ranges
  compliance_mappings:
    PCI_DSS:
    - 1.2.1
    - 1.3.1
    ISO_27001:
    - A.13.1.1
    - A.9.1.2
    ISO_27701:
    - 6.10.1.1
    SOC_2:
    - CC6.1
    - CC6.6
    GDPR:
    - Art.32
    ISMS_P:
    - 2.8.1
    - 2.8.2
  attack_scenarios:
  - technique: SSH Brute Force and Credential Stuffing
    description: 'An attacker discovers SSH exposed to 0.0.0.0/0 via port scanning and performs dictionary
      attacks or credential stuffing. Once inside, they steal AWS credentials from instance metadata.

      '
    mitre_tactic: Initial Access (TA0001)
    impact: 'Full OS compromise, ability to steal EC2 IAM role credentials, lateral movement to other
      AWS services, data theft.

      '
    threat_source: ADVERSARIAL
  - technique: SSH Key Exploitation and Persistence
    description: 'After gaining initial SSH access, the attacker installs backdoor SSH keys, creates cron-based
      reverse shells, and uses the instance as a pivot point into the VPC.

      '
    mitre_tactic: Persistence (TA0003)
    impact: 'Persistent unauthorized access, VPC-internal lateral movement, long-term data exfiltration
      channel.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check ec2_sg_ssh_open_to_world
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - SSH Brute Force and Credential Stuffing
    - SSH Key Exploitation and Persistence
    mitre_tactics: &id001
    - TA0001
    - TA0009
    - TA0040
    impact: 'Full OS compromise, ability to steal EC2 IAM role credentials, lateral movement to other
      AWS services, data theft.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - SSH Brute Force and Credential Stuffing
    - SSH Key Exploitation and Persistence
    mitre_tactics: &id002
    - TA0006
    - TA0004
    impact: 'Full OS compromise, ability to steal EC2 IAM role credentials, lateral movement to other
      AWS services, data theft.

      '

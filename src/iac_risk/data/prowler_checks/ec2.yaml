- check_id: ec2_sg_unrestricted_egress
  title: Security Group Unrestricted Egress
  description: Ensure security group does not allow unrestricted outbound traffic on all ports
  severity: MODERATE
  resource_types:
  - aws_security_group
  detection_logic:
    field_path: egress
    operator: not_contains
    expected_value:
      from_port: 0
      to_port: 0
      protocol: '-1'
      cidr_blocks:
      - 0.0.0.0/0
  remediation: Restrict egress to required destinations and ports only
  compliance_mappings:
    PCI_DSS:
    - 1.2.1
    ISO_27001:
    - A.13.1.1
    SOC_2:
    - CC6.6
    ISMS_P:
    - 2.8.1
  attack_scenarios:
  - technique: C2 Channel Establishment and Data Exfiltration
    description: 'A compromised instance with unrestricted egress establishes reverse shells to attacker-controlled
      C2 servers and exfiltrates data over arbitrary ports without network controls.

      '
    mitre_tactic: Command & Control (TA0011)
    impact: 'Uncontrolled outbound data exfiltration, persistent C2 channels, ability to download additional
      attack tools.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check ec2_sg_unrestricted_egress
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - C2 Channel Establishment and Data Exfiltration
    mitre_tactics: *id001
    impact: 'Uncontrolled outbound data exfiltration, persistent C2 channels, ability to download additional
      attack tools.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - C2 Channel Establishment and Data Exfiltration
    mitre_tactics: &id003
    - TA0009
    - TA0040
    impact: 'Uncontrolled outbound data exfiltration, persistent C2 channels, ability to download additional
      attack tools.

      '
- check_id: ec2_imdsv2_required
  title: EC2 Instance IMDSv2 Required
  description: Ensure EC2 instances require IMDSv2 (Instance Metadata Service v2)
  severity: HIGH
  resource_types:
  - aws_instance
  detection_logic:
    field_path: metadata_options.0.http_tokens
    operator: equals
    expected_value: required
  remediation: Configure metadata_options to require http_tokens (IMDSv2)
  compliance_mappings:
    PCI_DSS:
    - 2.2.4
    ISO_27001:
    - A.14.1.2
    SOC_2:
    - CC6.1
    GDPR:
    - Art.32
    ISMS_P:
    - 2.6.7
    - 2.10.1
  attack_scenarios:
  - technique: SSRF to IMDS Credential Theft
    description: 'An attacker exploits an application SSRF vulnerability to request http://169.254.169.254/latest/meta-data/iam/
      security-credentials/ and steals temporary IAM role credentials. IMDSv1 requires only a simple GET
      request with no token.

      '
    mitre_tactic: Credential Access (TA0006)
    impact: 'Theft of IAM role credentials, API access to AWS services with instance role permissions,
      privilege escalation.

      '
    threat_source: ADVERSARIAL
  - technique: IMDS-Based Cloud Pivot
    description: "After stealing IMDS credentials via SSRF, the attacker uses them from outside the instance\
      \ to enumerate and access other AWS resources \u2014 S3 buckets, DynamoDB tables, Lambda functions\
      \ \u2014 escalating impact beyond the single instance.\n"
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Lateral movement across AWS services, access to sensitive data stores, potential full account
      compromise.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 2
    rationale: Keyword-based classification from check ec2_imdsv2_required
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - SSRF to IMDS Credential Theft
    - IMDS-Based Cloud Pivot
    mitre_tactics: *id001
    impact: 'Theft of IAM role credentials, API access to AWS services with instance role permissions,
      privilege escalation.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - SSRF to IMDS Credential Theft
    - IMDS-Based Cloud Pivot
    mitre_tactics: *id003
    impact: 'Theft of IAM role credentials, API access to AWS services with instance role permissions,
      privilege escalation.

      '
- check_id: ec2_ebs_encryption

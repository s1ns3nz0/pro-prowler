- check_id: kms_key_rotation
  title: KMS Key Rotation Enabled
  description: Ensure KMS keys have automatic rotation enabled
  severity: MODERATE
  resource_types:
  - aws_kms_key
  detection_logic:
    field_path: enable_key_rotation
    operator: equals
    expected_value: true
  remediation: Enable automatic key rotation on KMS keys
  compliance_mappings:
    PCI_DSS:
    - 3.6.4
    ISO_27001:
    - A.10.1.2
    SOC_2:
    - CC6.1
    GDPR:
    - Art.32
    ISMS_P:
    - 2.5.2
  attack_scenarios:
  - technique: Long-Term Cryptographic Key Compromise
    description: "KMS keys without rotation remain in use indefinitely. If a key is compromised through\
      \ insider threat or supply chain attack, all data encrypted with that key \u2014 past and future\
      \ \u2014 remains vulnerable to bulk decryption.\n"
    mitre_tactic: Exfiltration (TA0010)
    impact: 'Long-term cryptographic exposure, bulk decryption of historical data with a single compromised
      key.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 2
    rationale: Keyword-based classification from check kms_key_rotation
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Long-Term Cryptographic Key Compromise
    mitre_tactics: *id001
    impact: 'Long-term cryptographic exposure, bulk decryption of historical data with a single compromised
      key.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Long-Term Cryptographic Key Compromise
    mitre_tactics: *id003
    impact: 'Long-term cryptographic exposure, bulk decryption of historical data with a single compromised
      key.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Long-Term Cryptographic Key Compromise
    mitre_tactics: *id002
    impact: 'Long-term cryptographic exposure, bulk decryption of historical data with a single compromised
      key.

      '

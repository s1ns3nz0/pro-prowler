- check_id: cloudtrail_enabled
  title: CloudTrail Logging Enabled
  description: Ensure CloudTrail is enabled for API logging
  severity: HIGH
  resource_types:
  - aws_cloudtrail
  detection_logic:
    field_path: enable_logging
    operator: equals
    expected_value: true
  remediation: Enable CloudTrail logging
  compliance_mappings:
    PCI_DSS:
    - '10.1'
    - '10.2'
    - '10.3'
    ISO_27001:
    - A.12.4.1
    - A.12.4.3
    ISO_27701:
    - 6.9.4.1
    SOC_2:
    - CC7.2
    - CC7.3
    GDPR:
    - Art.30
    - Art.33
    ISMS_P:
    - 2.9.1
    - 2.9.3
  attack_scenarios:
  - technique: Undetected Privilege Escalation and Persistence
    description: 'Without CloudTrail, an attacker performs privilege escalation, creates backdoor IAM
      users, assumes roles, and installs persistence mechanisms with zero audit trail. Incident response
      teams have no evidence of the compromise.

      '
    mitre_tactic: Defense Evasion (TA0005)
    impact: 'Complete lack of audit logging, inability to detect attacks, compromised incident response
      capabilities.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check cloudtrail_enabled
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Undetected Privilege Escalation and Persistence
    mitre_tactics: &id001
    - TA0009
    - TA0040
    impact: 'Complete lack of audit logging, inability to detect attacks, compromised incident response
      capabilities.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Undetected Privilege Escalation and Persistence
    mitre_tactics: &id002
    - TA0001
    - TA0009
    - TA0040
    impact: 'Complete lack of audit logging, inability to detect attacks, compromised incident response
      capabilities.

      '
- check_id: vpc_flow_logs_enabled
  title: VPC Flow Logs Enabled
  description: Ensure VPC has flow logs enabled
  severity: MODERATE
  resource_types:
  - aws_vpc
  detection_logic:
    field_path: enable_dns_support
    operator: exists
    sub_resource_type: aws_flow_log
    sub_resource_link_field: vpc_id
  remediation: Enable VPC flow logs for network monitoring
  compliance_mappings:
    PCI_DSS:
    - '10.2'
    - '10.3'
    ISO_27001:
    - A.12.4.1
    SOC_2:
    - CC7.2
    GDPR:
    - Art.33
    ISMS_P:
    - 2.9.1
  attack_scenarios:
  - technique: Undetected Lateral Movement and C2
    description: 'Without VPC Flow Logs, network-based attacks go undetected. An attacker performs port
      scanning, connects to unauthorized systems, and establishes C2 channels without network visibility
      or correlation capabilities.

      '
    mitre_tactic: Defense Evasion (TA0005)
    impact: 'Invisible network attacks, undetected lateral movement, inability to trace exfiltration paths.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check vpc_flow_logs_enabled
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Undetected Lateral Movement and C2
    mitre_tactics: *id001
    impact: 'Invisible network attacks, undetected lateral movement, inability to trace exfiltration paths.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Undetected Lateral Movement and C2
    mitre_tactics: *id002
    impact: 'Invisible network attacks, undetected lateral movement, inability to trace exfiltration paths.

      '
- check_id: ebs_default_encryption
  title: EBS Default Encryption Enabled
  description: Ensure EBS default encryption is enabled in the account
  severity: MODERATE
  resource_types:
  - aws_ebs_encryption_by_default
  detection_logic:
    field_path: enabled
    operator: equals
    expected_value: true
  remediation: Enable EBS default encryption
  compliance_mappings:
    PCI_DSS:
    - '3.4'
    ISO_27001:
    - A.10.1.1
    SOC_2:
    - CC6.7
    ISMS_P:
    - 2.5.1
  attack_scenarios:
  - technique: Cross-Account EBS Snapshot Theft
    description: 'Without default encryption, new volumes are unencrypted. An attacker creates snapshots,
      shares them across accounts, or attaches volumes to forensics instances to extract data directly
      from the filesystem.

      '
    mitre_tactic: Exfiltration (TA0010)
    impact: 'Unencrypted storage exposure, snapshot-based data theft across accounts, complete filesystem
      extraction.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 2
    rationale: Keyword-based classification from check ebs_default_encryption
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Cross-Account EBS Snapshot Theft
    mitre_tactics: *id002
    impact: 'Unencrypted storage exposure, snapshot-based data theft across accounts, complete filesystem
      extraction.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Cross-Account EBS Snapshot Theft
    mitre_tactics: *id001
    impact: 'Unencrypted storage exposure, snapshot-based data theft across accounts, complete filesystem
      extraction.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Cross-Account EBS Snapshot Theft
    mitre_tactics: &id003
    - TA0006
    - TA0004
    impact: 'Unencrypted storage exposure, snapshot-based data theft across accounts, complete filesystem
      extraction.

      '

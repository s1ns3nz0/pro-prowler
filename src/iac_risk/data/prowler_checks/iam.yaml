- check_id: iam_access_key_rotation
  title: IAM Access Key Rotation
  description: Ensure IAM access keys are rotated within 90 days
  severity: MODERATE
  resource_types:
  - aws_iam_access_key
  detection_logic:
    field_path: status
    operator: equals
    expected_value: Active
  remediation: Rotate IAM access keys every 90 days and deactivate old keys
  compliance_mappings:
    PCI_DSS:
    - 3.6.4
    - 8.2.4
    ISO_27001:
    - A.9.2.4
    - A.9.4.3
    ISO_27701:
    - 6.6.2.2
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    ISMS_P:
    - 2.6.4
    - 2.5.2
  attack_scenarios:
  - technique: Stale Access Key Exploitation
    description: 'Long-lived access keys that are never rotated provide an extended window for exploitation.
      An attacker who obtains a leaked key from code repositories, logs, or insider access can use it
      indefinitely without detection if it is never rotated.

      '
    mitre_tactic: Credential Access (TA0006)
    impact: 'Long-term unauthorized API access, extended exploitation window, difficulty detecting compromised
      credentials.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check iam_access_key_rotation
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Stale Access Key Exploitation
    mitre_tactics: *id001
    impact: 'Long-term unauthorized API access, extended exploitation window, difficulty detecting compromised
      credentials.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Stale Access Key Exploitation
    mitre_tactics: *id002

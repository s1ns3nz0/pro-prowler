- check_id: iam_password_policy_length
  title: IAM Password Policy Minimum Length
  description: Ensure IAM password policy requires minimum length of 14 characters
  severity: MODERATE
  resource_types:
  - aws_iam_account_password_policy
  detection_logic:
    field_path: minimum_password_length
    operator: greater_than
    expected_value: 13
  remediation: Set minimum_password_length to at least 14 in the account password policy
  compliance_mappings:
    PCI_DSS:
    - 8.2.3
    ISO_27001:
    - A.9.4.3
    ISO_27701:
    - 6.6.4.1
    SOC_2:
    - CC6.1
    GDPR:
    - Art.32
    ISMS_P:
    - 2.6.4
  attack_scenarios:
  - technique: Password Brute Force and Dictionary Attack
    description: 'A weak minimum password length allows users to set short passwords that are vulnerable
      to brute force and dictionary attacks. An attacker uses automated tools to crack short passwords
      in minutes, gaining console access to IAM users.

      '
    mitre_tactic: Credential Access (TA0006)
    impact: 'Successful password cracking, unauthorized console access, ability to perform actions with
      the compromised user''s permissions.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 4
    availability: 2
    rationale: Keyword-based classification from check iam_password_policy_length
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Password Brute Force and Dictionary Attack
    mitre_tactics: *id001
    impact: 'Successful password cracking, unauthorized console access, ability to perform actions with
      the compromised user''s permissions.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Password Brute Force and Dictionary Attack
    mitre_tactics: *id002

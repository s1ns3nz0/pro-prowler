      credentials.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Stale Access Key Exploitation
    mitre_tactics: *id003
    impact: 'Long-term unauthorized API access, extended exploitation window, difficulty detecting compromised
      credentials.

      '

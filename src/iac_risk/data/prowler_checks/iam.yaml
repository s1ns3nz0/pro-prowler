- check_id: iam_policy_wildcard_actions
  title: IAM Policy Wildcard Actions
  description: Ensure IAM policies do not use wildcard (*) actions
  severity: CRITICAL
  resource_types:
  - aws_iam_policy
  detection_logic:
    field_path: policy
    operator: not_contains
    expected_value: '"Action":"*"'
  remediation: Replace wildcard actions with specific, least-privilege permissions
  compliance_mappings:
    PCI_DSS:
    - 7.1.1
    - 7.1.2
    ISO_27001:
    - A.9.2.3
    - A.9.4.1
    ISO_27701:
    - 6.6.2.1
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    - Art.25
    ISMS_P:
    - 2.6.1
    - 2.6.2
  attack_scenarios:
  - technique: Wildcard Permission Exploitation
    description: 'An attacker gaining control of a principal with Action:* has unlimited AWS API access.
      They enumerate all services, create backdoor IAM users, modify security policies, and exfiltrate
      data from any service.

      '
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Unrestricted AWS API access, ability to compromise entire AWS environment, admin-equivalent
      permissions.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check iam_policy_wildcard_actions
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Wildcard Permission Exploitation
    mitre_tactics: &id001
    - TA0009
    - TA0040
    impact: 'Unrestricted AWS API access, ability to compromise entire AWS environment, admin-equivalent
      permissions.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Wildcard Permission Exploitation
    mitre_tactics: &id002
    - TA0006
    - TA0004
    impact: 'Unrestricted AWS API access, ability to compromise entire AWS environment, admin-equivalent
      permissions.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Wildcard Permission Exploitation
    mitre_tactics: &id003
    - TA0001
    - TA0009
    - TA0040
    impact: 'Unrestricted AWS API access, ability to compromise entire AWS environment, admin-equivalent
      permissions.

      '
- check_id: iam_policy_wildcard_resource
  title: IAM Policy Wildcard Resource
  description: Ensure IAM policies do not grant access to all resources (*)
  severity: HIGH
  resource_types:
  - aws_iam_policy
  detection_logic:
    field_path: policy
    operator: not_contains
    expected_value: '"Resource":"*"'
  remediation: Scope resource ARNs to specific resources
  compliance_mappings:
    PCI_DSS:
    - 7.1.1
    ISO_27001:
    - A.9.2.3
    SOC_2:
    - CC6.1
    - CC6.3
    ISMS_P:
    - 2.6.2
  attack_scenarios:
  - technique: Cross-Resource Privilege Escalation
    description: 'A policy with Resource:* allows the principal to modify any AWS resource. An attacker
      targets sensitive IAM roles, modifies trust policies to allow self-assumption, and attaches admin
      policies to themselves.

      '
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Ability to modify any AWS resource, privilege escalation through role assumption hijacking,
      org-wide lateral movement.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check iam_policy_wildcard_resource
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Cross-Resource Privilege Escalation
    mitre_tactics: *id001
    impact: 'Ability to modify any AWS resource, privilege escalation through role assumption hijacking,
      org-wide lateral movement.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Cross-Resource Privilege Escalation
    mitre_tactics: *id002
    impact: 'Ability to modify any AWS resource, privilege escalation through role assumption hijacking,
      org-wide lateral movement.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Cross-Resource Privilege Escalation
    mitre_tactics: *id003
    impact: 'Ability to modify any AWS resource, privilege escalation through role assumption hijacking,
      org-wide lateral movement.

      '
- check_id: iam_role_trust_policy_restricted
  title: IAM Role Trust Policy Restricted
  description: Ensure IAM role trust policy does not allow assumption by all AWS principals
  severity: CRITICAL
  resource_types:
  - aws_iam_role
  detection_logic:
    field_path: assume_role_policy
    operator: not_contains
    expected_value: '"Principal":"*"'
  remediation: Restrict the trust policy to specific AWS accounts or services
  compliance_mappings:
    PCI_DSS:
    - 7.1.1
    - 7.1.2
    ISO_27001:
    - A.9.2.3
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    ISMS_P:
    - 2.6.1
    - 2.6.7
  attack_scenarios:
  - technique: Cross-Account Role Assumption
    description: 'A role with Principal:* can be assumed by any AWS principal in any account. An attacker
      from an external account assumes this role and gains its permissions, enabling cross-account privilege
      escalation.

      '
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Cross-account access, unauthorized role assumption, ability to access sensitive role permissions
      from external accounts.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check iam_role_trust_policy_restricted
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Cross-Account Role Assumption
    mitre_tactics: *id001
    impact: 'Cross-account access, unauthorized role assumption, ability to access sensitive role permissions
      from external accounts.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Cross-Account Role Assumption
    mitre_tactics: *id002
    impact: 'Cross-account access, unauthorized role assumption, ability to access sensitive role permissions
      from external accounts.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Cross-Account Role Assumption
    mitre_tactics: *id003
    impact: 'Cross-account access, unauthorized role assumption, ability to access sensitive role permissions
      from external accounts.

      '
- check_id: iam_no_inline_policy_on_user
  title: No Inline Policies on IAM Users
  description: Ensure IAM users do not have inline policies attached
  severity: MODERATE
  resource_types:
  - aws_iam_user_policy
  detection_logic:
    field_path: policy
    operator: not_exists
  remediation: Use managed policies attached to groups or roles instead of inline user policies
  compliance_mappings:
    PCI_DSS:
    - 7.1.1
    ISO_27001:
    - A.9.2.3
    SOC_2:
    - CC6.1
    ISMS_P:
    - 2.6.2
  attack_scenarios:
  - technique: Inline Policy Injection for Privilege Escalation
    description: 'An attacker with iam:PutUserPolicy permission injects an inline policy granting admin
      permissions, bypassing permission boundaries. Inline policies are harder to audit than managed policies,
      enabling stealthy privilege escalation.

      '
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Direct privilege escalation without boundary constraints, hidden policy modifications difficult
      to detect in audits.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check iam_no_inline_policy_on_user
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Inline Policy Injection for Privilege Escalation
    mitre_tactics: *id001
    impact: 'Direct privilege escalation without boundary constraints, hidden policy modifications difficult
      to detect in audits.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Inline Policy Injection for Privilege Escalation
    mitre_tactics: *id002
    impact: 'Direct privilege escalation without boundary constraints, hidden policy modifications difficult
      to detect in audits.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Inline Policy Injection for Privilege Escalation
    mitre_tactics: *id003
    impact: 'Direct privilege escalation without boundary constraints, hidden policy modifications difficult
      to detect in audits.


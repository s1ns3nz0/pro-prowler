- check_id: iam_policy_no_full_admin
  title: IAM Policy No Full Admin Access
  description: Ensure no IAM policy grants full administrator access (Action:* on Resource:*)
  severity: CRITICAL
  resource_types:
  - aws_iam_policy
  detection_logic:
    field_path: policy
    operator: not_contains
    expected_value: '"Effect":"Allow","Action":"*","Resource":"*"'
  remediation: Remove full admin access and apply least-privilege principle
  compliance_mappings:
    PCI_DSS:
    - 7.1.1
    - 7.1.2
    - '7.2'
    ISO_27001:
    - A.9.2.3
    - A.9.4.1
    ISO_27701:
    - 6.6.2.1
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    - Art.25
    ISMS_P:
    - 2.6.1
    - 2.6.2
    - 2.6.7
  attack_scenarios:
  - technique: Full AWS Environment Compromise
    description: "An attacker controlling a principal with Action:* and Resource:* can perform any action\
      \ on any resource \u2014 creating admin accounts, disabling CloudTrail, exfiltrating all data, and\
      \ destroying infrastructure.\n"
    mitre_tactic: Privilege Escalation (TA0004)
    impact: 'Complete AWS environment compromise, unlimited privilege escalation, ability to disable all
      security controls.

      '
    threat_source: ADVERSARIAL
  - technique: Backdoor Account Creation and Persistence
    description: 'With full admin, the attacker creates new IAM users with console access, generates long-lived
      access keys, and sets up cross-account roles for persistent re-entry even after the initial compromise
      is remediated.

      '
    mitre_tactic: Persistence (TA0003)
    impact: 'Persistent access surviving credential rotation, multiple re-entry paths, difficult to fully
      eradicate.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check iam_policy_no_full_admin
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Full AWS Environment Compromise
    - Backdoor Account Creation and Persistence
    mitre_tactics: *id001
    impact: 'Complete AWS environment compromise, unlimited privilege escalation, ability to disable all
      security controls.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Full AWS Environment Compromise
    - Backdoor Account Creation and Persistence
    mitre_tactics: *id002
    impact: 'Complete AWS environment compromise, unlimited privilege escalation, ability to disable all
      security controls.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Full AWS Environment Compromise
    - Backdoor Account Creation and Persistence
    mitre_tactics: *id003

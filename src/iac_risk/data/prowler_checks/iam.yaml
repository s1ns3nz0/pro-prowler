      the compromised user''s permissions.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Password Brute Force and Dictionary Attack
    mitre_tactics: *id003

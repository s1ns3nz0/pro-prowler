- check_id: rds_public_accessibility
  title: RDS Instance Not Publicly Accessible
  description: Ensure RDS instances are not publicly accessible
  severity: CRITICAL
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: publicly_accessible
    operator: equals
    expected_value: false
  remediation: Set publicly_accessible to false on the RDS instance
  compliance_mappings:
    PCI_DSS:
    - 1.2.1
    - 1.3.1
    - 1.3.2
    ISO_27001:
    - A.13.1.1
    ISO_27701:
    - 6.10.1.1
    SOC_2:
    - CC6.1
    - CC6.6
    GDPR:
    - Art.32
    - Art.25
    ISMS_P:
    - 2.8.2
    - 2.7.2
  attack_scenarios:
  - technique: Direct Database Brute Force
    description: 'An attacker discovers a publicly accessible RDS endpoint via network scanning, attempts
      default credentials or brute-force attacks, and gains full database access to extract all data.

      '
    mitre_tactic: Initial Access (TA0001)
    impact: 'Direct unauthorized database access, full data exfiltration, ability to modify or delete
      critical business data.

      '
    threat_source: ADVERSARIAL
  - technique: Database Credential Enumeration
    description: 'An attacker connects to the public RDS endpoint and enumerates database users, schemas,
      and tables. Even without full access, metadata leakage reveals the organization''s data architecture.

      '
    mitre_tactic: Discovery (TA0007)
    impact: 'Database schema exposure, user enumeration, information useful for planning further targeted
      attacks.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 2
    availability: 2
    rationale: Keyword-based classification from check rds_public_accessibility
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Direct Database Brute Force
    - Database Credential Enumeration
    mitre_tactics: &id001
    - TA0001
    - TA0009
    - TA0040
    impact: 'Direct unauthorized database access, full data exfiltration, ability to modify or delete
      critical business data.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Direct Database Brute Force
    - Database Credential Enumeration
    mitre_tactics: &id002
    - TA0006
    - TA0004
    impact: 'Direct unauthorized database access, full data exfiltration, ability to modify or delete
      critical business data.

      '
- check_id: rds_encryption_at_rest
  title: RDS Encryption at Rest
  description: Ensure RDS instances have encryption at rest enabled
  severity: HIGH
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: storage_encrypted
    operator: equals
    expected_value: true
  remediation: Enable storage encryption on the RDS instance
  compliance_mappings:
    PCI_DSS:
    - '3.4'
    - 3.4.1
    ISO_27001:
    - A.10.1.1
    ISO_27701:
    - 6.7.1.1
    SOC_2:
    - CC6.1
    - CC6.7
    GDPR:
    - Art.32
    - Art.25
    ISMS_P:
    - 2.5.1
    - 2.7.1
  attack_scenarios:
  - technique: RDS Snapshot Exfiltration
    description: 'An attacker creates a snapshot of an unencrypted RDS instance, shares it to an account
      they control, and restores it to access all database contents without needing database credentials.

      '
    mitre_tactic: Exfiltration (TA0010)
    impact: 'Full database exposure via snapshots, complete data exfiltration without authentication.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 2
    rationale: Keyword-based classification from check rds_encryption_at_rest
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - RDS Snapshot Exfiltration
    mitre_tactics: *id001
    impact: 'Full database exposure via snapshots, complete data exfiltration without authentication.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - RDS Snapshot Exfiltration
    mitre_tactics: &id003
    - TA0009
    - TA0040
    impact: 'Full database exposure via snapshots, complete data exfiltration without authentication.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - RDS Snapshot Exfiltration
    mitre_tactics: *id002
    impact: 'Full database exposure via snapshots, complete data exfiltration without authentication.

      '
- check_id: rds_multi_az
  title: RDS Multi-AZ Deployment
  description: Ensure RDS instances use Multi-AZ deployment for high availability
  severity: MODERATE
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: multi_az
    operator: equals
    expected_value: true
  remediation: Enable Multi-AZ deployment on the RDS instance
  compliance_mappings:
    ISO_27001:
    - A.17.1.1
    - A.17.2.1
    SOC_2:
    - CC7.5
    - A1.2
    GDPR:
    - Art.32
    ISMS_P:
    - 2.12.1
  attack_scenarios:
  - technique: Single-AZ Denial of Service
    description: 'An attacker causes instance failure through resource exhaustion or targeted disruption.
      Without Multi-AZ, the database has no automatic failover, causing extended downtime and business
      disruption.

      '
    mitre_tactic: Impact (TA0040)
    impact: 'Database unavailability, extended downtime, potential data loss, SLA violations.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 2
    integrity: 3
    availability: 5
    rationale: Keyword-based classification from check rds_multi_az
  threat_actors:
  - actor_name: Accidental User
    actor_type: ACCIDENTAL
    capability: Low
    motivation: Human error, misconfiguration
    techniques:
    - Single-AZ Denial of Service
    mitre_tactics: &id004 []
    impact: 'Database unavailability, extended downtime, potential data loss, SLA violations.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Single-AZ Denial of Service
    mitre_tactics: *id003
    impact: 'Database unavailability, extended downtime, potential data loss, SLA violations.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Single-AZ Denial of Service
    mitre_tactics: *id001
    impact: 'Database unavailability, extended downtime, potential data loss, SLA violations.

      '
- check_id: rds_backup_retention
  title: RDS Automated Backups Enabled
  description: Ensure RDS instances have automated backup retention configured
  severity: MODERATE
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: backup_retention_period
    operator: greater_than
    expected_value: 0
  remediation: Set backup_retention_period to at least 7 days
  compliance_mappings:
    PCI_DSS:
    - '10.7'
    ISO_27001:
    - A.12.3.1
    SOC_2:
    - CC6.1
    - A1.2
    GDPR:
    - Art.5
    - Art.32
    ISMS_P:
    - 2.12.1
    - 2.9.3
  attack_scenarios:
  - technique: Database Ransomware with No Recovery
    description: 'An attacker gains database access, encrypts or deletes all data, and demands ransom.
      Without backup retention, the organization has no recovery points and faces permanent data loss.

      '
    mitre_tactic: Impact (TA0040)
    impact: 'Inability to recover from ransomware, permanent data loss, extended business downtime.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 2
    integrity: 3
    availability: 5
    rationale: Keyword-based classification from check rds_backup_retention
  threat_actors:
  - actor_name: Accidental User
    actor_type: ACCIDENTAL
    capability: Low
    motivation: Human error, misconfiguration
    techniques:
    - Database Ransomware with No Recovery
    mitre_tactics: *id004
    impact: 'Inability to recover from ransomware, permanent data loss, extended business downtime.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Database Ransomware with No Recovery
    mitre_tactics: *id003
    impact: 'Inability to recover from ransomware, permanent data loss, extended business downtime.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Database Ransomware with No Recovery
    mitre_tactics: *id001
    impact: 'Inability to recover from ransomware, permanent data loss, extended business downtime.

      '

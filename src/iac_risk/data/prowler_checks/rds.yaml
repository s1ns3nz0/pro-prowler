- check_id: rds_iam_authentication
  title: RDS IAM Database Authentication
  description: Ensure RDS instance has IAM database authentication enabled
  severity: MODERATE
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: iam_database_authentication_enabled
    operator: equals
    expected_value: true
  remediation: Enable iam_database_authentication_enabled on the RDS instance
  compliance_mappings:
    PCI_DSS:
    - 8.2.1
    - 7.1.1
    ISO_27001:
    - A.9.4.1
    - A.9.2.3
    ISO_27701:
    - 6.6.2.1
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    ISMS_P:
    - 2.6.1
    - 2.6.4
  attack_scenarios:
  - technique: Database Credential Theft and Reuse
    description: 'Without IAM authentication, database access relies on static username/password credentials.
      An attacker who obtains these credentials from application configs, environment variables, or code
      repositories has persistent database access that is difficult to revoke without credential rotation.

      '
    mitre_tactic: Credential Access (TA0006)
    impact: 'Static credential compromise enabling persistent database access, difficulty revoking access
      without rotating credentials across all consuming applications.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 3
    availability: 3
    rationale: Keyword-based classification from check rds_iam_authentication
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:

- check_id: rds_enhanced_monitoring
  title: RDS Enhanced Monitoring
  description: Ensure RDS instance has enhanced monitoring enabled
  severity: LOW
  resource_types:
  - aws_db_instance
  detection_logic:
    field_path: monitoring_interval
    operator: greater_than
    expected_value: 0
  remediation: Set monitoring_interval to a value greater than 0 for enhanced monitoring
  compliance_mappings:
    PCI_DSS:
    - '10.2'
    ISO_27001:
    - A.12.4.1
    - A.12.1.3
    ISO_27701:
    - 6.9.4.1
    SOC_2:
    - CC7.2
    GDPR:
    - Art.30
    ISMS_P:
    - 2.9.1
    - 2.11.1
  attack_scenarios:
  - technique: Undetected Database Resource Abuse
    description: 'Without enhanced monitoring, an attacker who gains database access can perform resource-intensive
      operations such as full table scans, data exports, or cryptomining queries. Basic CloudWatch metrics
      lack the granularity to detect these abnormal OS-level patterns.

      '
    mitre_tactic: Defense Evasion (TA0005)
    impact: 'Undetected database abuse, missed anomalous query patterns, inability to correlate OS-level
      metrics with suspicious activity.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 2
    integrity: 3
    availability: 4
    rationale: Keyword-based classification from check rds_enhanced_monitoring
  threat_actors:
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Undetected Database Resource Abuse
    mitre_tactics: *id003
    impact: 'Undetected database abuse, missed anomalous query patterns, inability to correlate OS-level
      metrics with suspicious activity.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Undetected Database Resource Abuse
    mitre_tactics: *id001
    impact: 'Undetected database abuse, missed anomalous query patterns, inability to correlate OS-level
      metrics with suspicious activity.

      '

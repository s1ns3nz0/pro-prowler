- check_id: s3_bucket_public_access_block
  title: S3 Bucket Public Access Block
  description: Ensure S3 bucket has public access block enabled
  severity: CRITICAL
  resource_types:
  - aws_s3_bucket
  detection_logic:
    field_path: block_public_acls
    operator: equals
    expected_value: true
    sub_resource_type: aws_s3_bucket_public_access_block
    sub_resource_link_field: bucket
  remediation: Enable public access block on the S3 bucket
  compliance_mappings:
    PCI_DSS:
    - 1.3.1
    - 1.3.2
    ISO_27001:
    - A.13.1.1
    ISO_27701:
    - 6.10.1.1
    SOC_2:
    - CC6.1
    - CC6.6
    GDPR:
    - Art.25
    - Art.32
    ISMS_P:
    - 2.6.1
    - 2.8.2
  attack_scenarios:
  - technique: S3 Bucket Enumeration and Exfiltration
    description: 'An attacker discovers the bucket without public access block and enumerates its contents
      using aws s3 ls. They download sensitive objects including credentials, source code, and customer
      data.

      '
    mitre_tactic: Initial Access (TA0001)
    impact: 'Unauthorized access to sensitive data including customer PII, source code, configuration
      secrets, and database backups.

      '
    threat_source: ADVERSARIAL
  - technique: Public Bucket Content Modification
    description: 'If write access is also available, an attacker modifies bucket contents to serve malicious
      files, deface hosted content, or inject backdoors into application artifacts stored in the bucket.

      '
    mitre_tactic: Impact (TA0040)
    impact: 'Supply chain compromise via modified application artifacts, defacement of hosted content,
      malware distribution.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 2
    availability: 2
    rationale: Keyword-based classification from check s3_bucket_public_access_block
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - S3 Bucket Enumeration and Exfiltration
    - Public Bucket Content Modification
    mitre_tactics: &id001
    - TA0001
    - TA0009
    - TA0040
    impact: 'Unauthorized access to sensitive data including customer PII, source code, configuration
      secrets, and database backups.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - S3 Bucket Enumeration and Exfiltration
    - Public Bucket Content Modification
    mitre_tactics: &id003
    - TA0006
    - TA0004
    impact: 'Unauthorized access to sensitive data including customer PII, source code, configuration
      secrets, and database backups.

      '
- check_id: s3_bucket_versioning_enabled
  title: S3 Bucket Versioning Enabled
  description: Ensure S3 bucket has versioning enabled to protect against accidental deletion
  severity: MODERATE
  resource_types:
  - aws_s3_bucket
  detection_logic:
    field_path: versioning_configuration.0.status
    operator: equals
    expected_value: Enabled
    sub_resource_type: aws_s3_bucket_versioning
    sub_resource_link_field: bucket
    legacy_field_path: versioning.0.enabled
    legacy_expected_value: true
  remediation: Enable versioning on the S3 bucket
  compliance_mappings:
    PCI_DSS:
    - 10.5.1
    ISO_27001:
    - A.12.3.1
    SOC_2:
    - CC6.1
    GDPR:
    - Art.5
    ISMS_P:
    - 2.12.1
  attack_scenarios:
  - technique: S3 Ransomware via Object Deletion
    description: 'An attacker with write access deletes all objects in a bucket without versioning. Without
      version history, deleted objects cannot be recovered, enabling a destructive ransomware attack.

      '
    mitre_tactic: Impact (TA0040)
    impact: 'Permanent data loss, inability to recover from deletions, business disruption, potential
      regulatory violations.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 3
    integrity: 5
    availability: 3
    rationale: Keyword-based classification from check s3_bucket_versioning_enabled
  threat_actors:
  - actor_name: Accidental User
    actor_type: ACCIDENTAL
    capability: Low
    motivation: Human error, misconfiguration
    techniques:
    - S3 Ransomware via Object Deletion
    mitre_tactics: []
    impact: 'Permanent data loss, inability to recover from deletions, business disruption, potential
      regulatory violations.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - S3 Ransomware via Object Deletion
    mitre_tactics: &id002
    - TA0009
    - TA0040
    impact: 'Permanent data loss, inability to recover from deletions, business disruption, potential
      regulatory violations.

      '
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - S3 Ransomware via Object Deletion
    mitre_tactics: *id001
    impact: 'Permanent data loss, inability to recover from deletions, business disruption, potential
      regulatory violations.

      '
- check_id: s3_bucket_encryption_enabled
  title: S3 Bucket Server-Side Encryption
  description: Ensure S3 bucket has server-side encryption enabled
  severity: HIGH
  resource_types:
  - aws_s3_bucket
  detection_logic:
    field_path: rule.0.apply_server_side_encryption_by_default.0.sse_algorithm
    operator: exists
    sub_resource_type: aws_s3_bucket_server_side_encryption_configuration
    sub_resource_link_field: bucket
    legacy_field_path: server_side_encryption_configuration.0.rule.0.apply_server_side_encryption_by_default.0.sse_algorithm
  remediation: Enable server-side encryption (AES256 or aws:kms) on the S3 bucket
  compliance_mappings:
    PCI_DSS:
    - '3.4'
    - 3.4.1
    ISO_27001:
    - A.10.1.1
    ISO_27701:
    - 6.7.1.1
    SOC_2:
    - CC6.1
    - CC6.7
    GDPR:
    - Art.32
    - Art.25
    ISMS_P:
    - 2.5.1
    - 2.7.1
  attack_scenarios:
  - technique: Plaintext Data Exfiltration
    description: 'An attacker with S3 read access downloads unencrypted objects and reads sensitive data
      in plaintext. No encryption key is needed, lowering the barrier to data theft.

      '
    mitre_tactic: Exfiltration (TA0010)
    impact: 'Sensitive data exposure in plaintext, regulatory compliance violations for encryption-at-rest
      requirements.

      '
    threat_source: ADVERSARIAL
  - technique: S3 Object Ransomware via Re-Encryption
    description: 'An attacker creates a custom KMS key, re-encrypts objects with their own key, and deletes
      the originals. The organization cannot decrypt without paying ransom.

      '
    mitre_tactic: Impact (TA0040)
    impact: 'Data held hostage, inability to access encrypted objects without attacker''s key, business
      disruption.

      '
    threat_source: ADVERSARIAL
  cia_impact:
    confidentiality: 5
    integrity: 3
    availability: 2
    rationale: Keyword-based classification from check s3_bucket_encryption_enabled
  threat_actors:
  - actor_name: External Attacker
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Financial gain, data theft, lateral movement
    techniques:
    - Plaintext Data Exfiltration
    - S3 Object Ransomware via Re-Encryption
    mitre_tactics: *id001
    impact: 'Sensitive data exposure in plaintext, regulatory compliance violations for encryption-at-rest
      requirements.

      '
  - actor_name: Malicious Insider
    actor_type: ADVERSARIAL
    capability: High
    motivation: Espionage, sabotage, disgruntlement
    techniques:
    - Plaintext Data Exfiltration
    - S3 Object Ransomware via Re-Encryption
    mitre_tactics: *id002
    impact: 'Sensitive data exposure in plaintext, regulatory compliance violations for encryption-at-rest
      requirements.

      '
  - actor_name: Compromised Credentials
    actor_type: ADVERSARIAL
    capability: Medium
    motivation: Account takeover, privilege escalation
    techniques:
    - Plaintext Data Exfiltration
    - S3 Object Ransomware via Re-Encryption
    mitre_tactics: *id003
    impact: 'Sensitive data exposure in plaintext, regulatory compliance violations for encryption-at-rest
      requirements.


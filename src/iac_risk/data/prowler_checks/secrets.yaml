- check_id: secretsmanager_rotation_enabled
  title: Secrets Manager Rotation Enabled
  description: Ensure Secrets Manager secret has automatic rotation enabled
  severity: HIGH
  resource_types:
  - aws_secretsmanager_secret
  detection_logic:
    field_path: rotation_rules.0.automatically_after_days
    operator: exists
    sub_resource_type: aws_secretsmanager_secret_rotation
    sub_resource_link_field: secret_id
  remediation: Configure automatic rotation with a rotation Lambda function
  compliance_mappings:
    PCI_DSS:
    - 3.6.4
    - 8.2.4
    ISO_27001:
    - A.9.2.4
    - A.10.1.2
    ISO_27701:
    - 6.6.2.2
    SOC_2:
    - CC6.1
    - CC6.3
    GDPR:
    - Art.32
    ISMS_P:
    - 2.5.2
    - 2.6.4
  attack_scenarios:
  - technique: Stale Credential Exploitation
    description: >
      Without automatic rotation, secrets remain valid indefinitely. An
      attacker who obtains a leaked or stolen credential can use it for
      months or years without detection, as the credential never expires
      or changes.
    mitre_tactic: "Credential Access (TA0006)"
    impact: >
      Long-term unauthorized access with stolen credentials, extended
      window of compromise, difficulty detecting credential misuse.
    threat_source: ADVERSARIAL
- check_id: secretsmanager_kms_encryption
  title: Secrets Manager Custom KMS Encryption
  description: Ensure Secrets Manager secret uses a customer-managed KMS key
  severity: MODERATE
  resource_types:
  - aws_secretsmanager_secret
  detection_logic:
    field_path: kms_key_id
    operator: exists
  remediation: Set kms_key_id to a customer-managed KMS key ARN
  compliance_mappings:
    PCI_DSS:
    - '3.4'
    - 3.5.2
    ISO_27001:
    - A.10.1.1
    - A.10.1.2
    ISO_27701:
    - 6.7.1.1
    SOC_2:
    - CC6.1
    - CC6.7
    GDPR:
    - Art.32
    ISMS_P:
    - 2.5.1
    - 2.5.2
  attack_scenarios:
  - technique: Cross-Account Secret Access via Default Key
    description: >
      Secrets encrypted with the default AWS-managed key cannot have their
      access independently controlled via key policy. An attacker with
      Secrets Manager read permissions can decrypt secrets without needing
      separate KMS key access grants.
    mitre_tactic: "Credential Access (TA0006)"
    impact: >
      Weaker access control boundaries for secrets, inability to
      independently revoke decryption access through key policies.
    threat_source: ADVERSARIAL
- check_id: acm_certificate_expiry
  title: ACM Certificate Not Expiring Soon
  description: Ensure ACM certificates are not expiring within 30 days
  severity: CRITICAL
  resource_types:
  - aws_acm_certificate
  detection_logic:
    field_path: validation_method
    operator: exists
  remediation: Renew or replace expiring ACM certificates and enable auto-renewal
  compliance_mappings:
    PCI_DSS:
    - '4.1'
    ISO_27001:
    - A.10.1.1
    - A.10.1.2
    ISO_27701:
    - 6.7.1.1
    SOC_2:
    - CC6.1
    - CC6.7
    GDPR:
    - Art.32
    ISMS_P:
    - 2.5.1
    - 2.5.2
  attack_scenarios:
  - technique: Expired Certificate Service Disruption
    description: >
      An expired TLS certificate causes browsers to display security
      warnings, breaking user trust and potentially causing service outages.
      An attacker can exploit the confusion to perform phishing attacks
      using similarly named domains with valid certificates.
    mitre_tactic: "Impact (TA0040)"
    impact: >
      Service disruption from certificate expiry, loss of user trust,
      potential for phishing attacks during certificate gap.
    threat_source: ADVERSARIAL
- check_id: acm_certificate_transparency
  title: ACM Certificate Transparency Logging
  description: Ensure ACM certificate has Certificate Transparency logging enabled
  severity: MODERATE
  resource_types:
  - aws_acm_certificate
  detection_logic:
    field_path: certificate_transparency_logging_preference
    operator: equals
    expected_value: ENABLED
    sub_resource_type: aws_acm_certificate
    sub_resource_link_field: domain_name
  remediation: Enable certificate_transparency_logging_preference on ACM certificates
  compliance_mappings:
    PCI_DSS:
    - '4.1'
    ISO_27001:
    - A.10.1.1
    ISO_27701:
    - 6.7.1.1
    SOC_2:
    - CC7.2
    GDPR:
    - Art.32
    ISMS_P:
    - 2.5.1
    - 2.9.1
  attack_scenarios:
  - technique: Rogue Certificate Issuance Detection Evasion
    description: >
      Without CT logging, a rogue or misissued certificate for the
      organization's domain goes undetected. An attacker obtains a
      fraudulent certificate and uses it for man-in-the-middle attacks
      against the organization's users.
    mitre_tactic: "Credential Access (TA0006)"
    impact: >
      Undetected rogue certificates enabling MITM attacks, inability
      to monitor for fraudulent certificate issuance.
    threat_source: ADVERSARIAL
